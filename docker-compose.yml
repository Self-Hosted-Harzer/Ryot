services:
  ryot-db:
    image: postgres:18-alpine # at-least version 15 is required
    restart: unless-stopped
    container_name: ryot-db
    networks:
      - mynet
    volumes:
      - ./postgres_storage:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    labels:
      # Sablier-Gruppierung
      - "sablier.enable=true"
      - "sablier.group=ryot"


  ryot:
    image: ignisda/ryot:v10 # or ghcr.io/ignisda/ryot:v10
    pull_policy: always
    container_name: ryot
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - mynet
    environment:
      - TZ=Europe/Berlin
      - FRONTEND_URL=https://ryot.micedric.dpdns.org
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ryot-db:5432/${POSTGRES_DATABASE}
      - SERVER_ADMIN_ACCESS_TOKEN=${TOKEN}
      - USERS_ALLOW_REGISTRATION=false
    labels:
      - "traefik.enable=true"

      # Routing / Subdomain
      - "traefik.http.routers.ryot.rule=Host(`ryot.micedric.dpdns.org`)"
      - "traefik.http.routers.ryot.entrypoints=websecure"
      - "traefik.http.routers.ryot.tls.certresolver=myresolver"
      - "traefik.http.routers.ryot.middlewares=ryot-sablier"
      - "traefik.http.services.ryot.loadbalancer.server.port=8000"

      # Sablier: Container darf trotz Stopp im Routing bleiben (Traefik >= v3.6 nötig)
      - "traefik.docker.allownonrunning=true"

      # Sablier-Gruppierung
      - "sablier.enable=true"
      - "sablier.group=ryot"

      # Sablier-Middleware-Konfiguration (Traefik-Plugin)
      - "traefik.http.middlewares.ryot-sablier.plugin.sablier.group=ryot"
      - "traefik.http.middlewares.ryot-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.ryot-sablier.plugin.sablier.sessionDuration=90m"
      - "traefik.http.middlewares.ryot-sablier.plugin.sablier.dynamic.displayName=Ryot"
      - "traefik.http.middlewares.ryot-sablier.plugin.sablier.dynamic.theme=hacker-terminal"
      - "traefik.http.middlewares.ryot-sablier.plugin.sablier.dynamic.refreshFrequency=3s"

networks:
  mynet:
    external: true